# O banco NÃO sobe aqui: ele vive no repositório OrcamentoPagamento-InfraSGBD, que cria
# o container orcamento-sqlserver e a rede orcamento-net. Suba ele primeiro:
#
#   cd ../OrcamentoPagamento-InfraSGBD && docker compose up -d
#
# Mensageria da Saga (RabbitMQ). Dois jeitos de rodar:
#
#   1. Junto com o OS Service (validação da Saga ponta a ponta): use o RabbitMQ do
#      docker-compose do ordemservico-service, publicado na 5672 do host. É o padrão:
#      RABBITMQ_HOST=host.docker.internal, com o usuário e a senha do .env de lá. No OS
#      Service, desligue o simulador do Billing (SIMULADOR_BILLING=false).
#
#        docker compose up --build
#
#   2. Sozinho, com um RabbitMQ próprio (perfil "rabbitmq", portas 5674/15674 no host para
#      não conflitar com OS Service e Execução):
#
#        RABBITMQ_HOST=rabbitmq docker compose --profile rabbitmq up --build
#
# Os manifestos Kubernetes ficam no OrcamentoPagamento-InfraKubernete.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: orcamento-rabbitmq
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5674:5672"     # AMQP
      - "15674:15672"   # painel de gestão: http://localhost:15674
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  orcamento-api:
    build:
      context: .
      dockerfile: src/OrcamentoPagamento.API/Dockerfile
    container_name: orcamento-api
    ports:
      # 8081 é do OS Service e 8082 da Execução: as três APIs rodam juntas no mesmo host.
      - "8083:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # orcamento-sqlserver é o container do InfraSGBD, alcançado pela rede orcamento-net.
      - ConnectionStrings__DefaultConnection=Server=orcamento-sqlserver;Database=MechanicOrcamentoDb;User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no .env - o mesmo do InfraSGBD};TrustServerCertificate=True;
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MechanicLtda.API
      - JwtSettings__IssuerCpf=MechanicLtda.Auth.Cpf
      - JwtSettings__Audience=MechanicLtda.Clients
      # Saga da OS pelo RabbitMQ (docs/contratos-eventos.md). MENSAGERIA_HABILITADA=false
      # sobe a API sozinha, sem broker: as mensagens da Saga só vão para o log.
      - Mensageria__Habilitada=${MENSAGERIA_HABILITADA:-true}
      - Mensageria__Transporte=RabbitMq
      - RabbitMq__Host=${RABBITMQ_HOST:-host.docker.internal}
      - RabbitMq__Porta=${RABBITMQ_PORTA:-5672}
      - RabbitMq__Usuario=${RABBITMQ_USER:-guest}
      - RabbitMq__Senha=${RABBITMQ_PASSWORD:-guest}
      # Pagamento. Os defaults mantêm o gateway fake, então subir sem .env funciona e
      # não toca no Mercado Pago. Trocar para o provedor real é editar o .env — o duplo
      # underscore é como o .NET mapeia seção aninhada (Pagamentos:MercadoPago:...).
      - Pagamentos__Habilitado=${PAGAMENTOS_HABILITADO:-false}
      - Pagamentos__MercadoPago__AccessToken=${MERCADOPAGO_ACCESS_TOKEN:-}
      - Pagamentos__MercadoPago__WebhookSecret=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - Pagamentos__MercadoPago__NotificationUrl=${MERCADOPAGO_NOTIFICATION_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - orcamento-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

networks:
  # Criada pelo docker-compose do OrcamentoPagamento-InfraSGBD. Se ela não existir, o
  # compose falha com "network orcamento-net declared as external, but could not be
  # found": suba o banco primeiro.
  orcamento-net:
    external: true
