# O banco NÃO sobe aqui: ele vive no repositório OrcamentoPagamento-InfraSGBD, que cria
# o container orcamento-sqlserver e a rede orcamento-net. Suba ele primeiro:
#
#   cd ../OrcamentoPagamento-InfraSGBD && docker compose up -d
#
# Os manifestos Kubernetes ficam no OrcamentoPagamento-InfraKubernete.
services:
  # SNS e SQS locais. Substitui a AWS no desenvolvimento, com os mesmos SDKs e a mesma
  # configuração de ARN/URL que a aplicação usa em produção.
  localstack:
    image: localstack/localstack:3
    container_name: orcamento-localstack
    environment:
      SERVICES: sns,sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  orcamento-api:
    build:
      context: .
      dockerfile: src/OrcamentoPagamento.API/Dockerfile
    container_name: orcamento-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # orcamento-sqlserver é o container do InfraSGBD, alcançado pela rede orcamento-net.
      - ConnectionStrings__DefaultConnection=Server=orcamento-sqlserver;Database=MechanicOrcamentoDb;User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no .env - o mesmo do InfraSGBD};TrustServerCertificate=True;
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=MechanicLtda.API
      - JwtSettings__IssuerCpf=MechanicLtda.Auth.Cpf
      - JwtSettings__Audience=MechanicLtda.Clients
      # Mensageria apontada para o LocalStack. Os nomes/ARNs são os criados pelo script
      # em scripts/localstack.
      - Messaging__Habilitado=true
      - Messaging__Regiao=us-east-1
      - Messaging__ServiceUrl=http://localstack:4566
      - Messaging__TopicoEventosArn=arn:aws:sns:us-east-1:000000000000:orcamento-eventos
      - Messaging__FilaItensAlteradosUrl=http://localstack:4566/000000000000/ordem-servico-itens-alterados
      # O SDK exige credenciais mesmo contra o LocalStack, que aceita qualquer valor.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      # Pagamento. Os defaults mantêm o gateway fake, então subir sem .env funciona e
      # não toca no Mercado Pago. Trocar para o provedor real é editar o .env — o duplo
      # underscore é como o .NET mapeia seção aninhada (Pagamentos:MercadoPago:...).
      - Pagamentos__Habilitado=${PAGAMENTOS_HABILITADO:-false}
      - Pagamentos__MercadoPago__AccessToken=${MERCADOPAGO_ACCESS_TOKEN:-}
      - Pagamentos__MercadoPago__WebhookSecret=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - Pagamentos__MercadoPago__NotificationUrl=${MERCADOPAGO_NOTIFICATION_URL:-}
    networks:
      - default
      - orcamento-net
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

networks:
  # Criada pelo docker-compose do OrcamentoPagamento-InfraSGBD. Se ela não existir, o
  # compose falha com "network orcamento-net declared as external, but could not be
  # found": suba o banco primeiro.
  orcamento-net:
    external: true
